services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.Api
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - StockData__ApiKey=${STOCK_API_KEY}
      - NewsData__ApiKey=${NEWS_API_KEY}
    networks:
      - sentimentwatch-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.Web
    ports:
      - "5200:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - SentimentApiBaseUrl=http://api:8080
    depends_on:
      - api
    networks:
      - sentimentwatch-network

networks:
  sentimentwatch-network:
    driver: bridge
